version: "2"
sql:
  - engine: "postgresql"
    queries: "query/queries.sql"
    schema: "migrations/001_init.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "sqlcgen"
        emit_json_tags: true
        overrides:
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
